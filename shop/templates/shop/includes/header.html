{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Panj Shanbe Bazaar{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <!-- adding the offline bootstrap file to load -->
    <link rel="stylesheet" href="{% static 'main.css' %}" />
    <link rel="stylesheet" href="{% static 'shop/index.css' %}" />
  </head>
  <body>
    <!-- LUSH STYLE TOP BAR -->
    <div class="top-announcement-bar">
      <div class="container-fluid">
        <div class="row align-items-center">
          <div class="col text-center">
            <span class="hot-label">HOT!</span>
            <marquee behavior="scroll" direction="left" class="marquee-text">
              iPhone 17 Pro • Samsung S26 Ultra • MacBook M3 • Dell Precision
              5570 • Royal Afghani Gand • Free Shipping on orders over $500!
            </marquee>
          </div>
        </div>
      </div>
    </div>

    <header class="lush-header"></header>
  </body>
</html>
